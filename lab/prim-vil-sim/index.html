<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原始人の村</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1712; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      .hint {
        position: fixed; right: 12px; bottom: 10px; margin: 0; max-width: calc(100vw - 420px); text-align: right;
        font: 12px sans-serif; color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      .time-bar {
        position: fixed; left: 12px; top: 10px; display: flex; align-items: center; gap: 4px;
        font: 14px sans-serif; color: #2a2018;
        background: rgba(255, 250, 235, 0.8); padding: 4px 6px; border-radius: 6px;
      }
      .time-date { margin-right: 6px; font-variant-numeric: tabular-nums; }
      .time-season {
        font: inherit; padding: 0 2px; cursor: pointer; color: inherit;
        border: 1px dashed #b8a888; border-radius: 4px; background: #f6efdc;
      }
      .time-bar button {
        font: inherit; min-width: 36px; padding: 2px 6px; cursor: pointer;
        border: 1px solid #b8a888; border-radius: 4px; background: #f6efdc; color: inherit;
      }
      .time-bar button.active { background: #6b5a3a; color: #fff6e0; border-color: #6b5a3a; }
      /* 画面右上:ログと村人パネルを縦に並べる */
      .side-column {
        position: fixed; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        max-height: calc(100vh - 60px); pointer-events: none;
      }
      .side-column > * { pointer-events: auto; }
      .inspector {
        width: 220px; flex: none;
        padding: 8px 10px; box-sizing: border-box;
        font: 13px sans-serif; color: #e8e2d0;
        background: rgba(20, 16, 12, 0.85); border-radius: 6px;
      }
      .inspector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      .inspector-header button {
        background: none; border: none; color: inherit; font-size: 18px; cursor: pointer; padding: 0 4px;
      }
      .inspector-info { white-space: pre-line; line-height: 1.5; margin-bottom: 6px; }
      .inspector-row { display: flex; align-items: center; gap: 6px; }
      .inspector-row span { width: 62px; flex: none; }
      .inspector-row input { flex: 1; min-width: 0; }
      .inspector-button {
        width: 100%; margin-top: 8px; padding: 4px; font: inherit; cursor: pointer;
        color: #2a2018; background: #e8d9a8; border: none; border-radius: 4px;
      }
      body.picking canvas { cursor: crosshair; }
      .inspector-note { margin: 4px 0 0; font-size: 11px; opacity: 0.6; }
      .debug-panel {
        margin: 0; flex: 0 1 auto; min-height: 0;
        /* 左上の日付バーに重ならない幅(狭い画面では細くする) */
        width: min(460px, max(200px, calc(100vw - 290px))); max-height: 32vh; overflow-y: auto;
        padding: 8px 10px; box-sizing: border-box;
        font: 12px/1.45 monospace; color: #e8e2d0;
        background: rgba(20, 16, 12, 0.82); border-radius: 6px;
        white-space: pre-wrap;
      }
      .mural-caption {
        position: fixed; left: 50%; top: 52px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 24px));
        padding: 8px 14px; box-sizing: border-box;
        font: 14px/1.5 serif; color: #f3e6c8; background: rgba(46, 36, 29, 0.92);
        border: 1px solid #8a6a48; border-radius: 6px; pointer-events: none;
      }
      .mural-list {
        position: fixed; left: 12px; top: 52px; width: min(420px, calc(100vw - 24px)); max-height: 60vh; overflow-y: auto;
        padding: 8px 12px; box-sizing: border-box;
        font: 13px/1.5 serif; color: #f3e6c8; background: rgba(46, 36, 29, 0.92); border-radius: 6px;
      }
      .mural-list ol { margin: 6px 0 0; padding-left: 1.6em; }
      .mural-list p { margin: 6px 0 0; opacity: 0.7; }
      /* 画面左下:セーブの書き出し・読み込み */
      .save-bar {
        position: fixed; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 4px;
        font: 12px sans-serif; color: #2a2018;
        background: rgba(255, 250, 235, 0.8); padding: 3px 6px; border-radius: 6px;
      }
      .save-bar button {
        font: inherit; padding: 2px 6px; cursor: pointer;
        border: 1px solid #b8a888; border-radius: 4px; background: #f6efdc; color: inherit;
      }
      .save-status { margin-left: 4px; opacity: 0.75; font-variant-numeric: tabular-nums; }
      /* 画面左下(セーブの上):ランダムイベントの一覧(チート) */
      .event-toggle {
        position: fixed; left: 12px; bottom: 42px; font: 12px sans-serif; padding: 3px 8px; cursor: pointer;
        color: #2a2018; background: rgba(255, 250, 235, 0.85); border: 1px solid #b8a888; border-radius: 6px;
      }
      .event-toggle.active { background: #6b5a3a; color: #fff6e0; border-color: #6b5a3a; }
      .event-panel {
        position: fixed; left: 12px; bottom: 72px; max-width: calc(100vw - 24px); max-height: 50vh; overflow-y: auto;
        padding: 8px 10px; box-sizing: border-box;
        font: 13px sans-serif; color: #e8e2d0; background: rgba(20, 16, 12, 0.88); border-radius: 6px;
      }
      .event-panel table { border-collapse: collapse; margin-top: 4px; }
      .event-panel td { padding: 2px 6px; white-space: nowrap; }
      .event-count { text-align: right; font-variant-numeric: tabular-nums; }
      .event-state { font-size: 11px; opacity: 0.7; min-width: 9em; }
      .event-panel button {
        font: 12px sans-serif; padding: 1px 6px; cursor: pointer;
        color: #2a2018; background: #e8d9a8; border: none; border-radius: 4px;
      }
      .event-note { margin: 4px 0 0; font-size: 11px; opacity: 0.75; min-height: 1em; }
    </style>
    <script type="module" crossorigin src="./assets/index-CO8N_mWv.js"></script>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <p class="hint">ドラッグ・矢印キー:移動 / ホイール:ズーム / クリック:村人を見る / Space:一時停止 / 1・2・3:×1・×4・×16 / T:1時間進める(Shift+T:1日) / L:ログ / D:村人の数値 / R:カーソルの位置に岩を落とす / E:イベント一覧(F:落石 W:増水 M:マンモス S:シカ B:大失敗) / I:カーソルの位置で火花を散らす / P:壁画の一覧(壁画はクリックで説明) / 左上の季節:季節を変える</p>
  </body>
</html>
